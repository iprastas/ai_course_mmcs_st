[project]
name = "agentic-ai-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.11.0",
    "litellm>=1.83.0",
    "openai>=3.17.0",
    "openai-agents>=0.22.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "sqlite-vec>=0.1.9",
    # веб-приложение week2/app: объявляем явно, не полагаясь на транзитивные
    # зависимости google-adk (fastapi/uvicorn/aiosqlite входят в его Requires-Dist,
    # но прямая зависимость защищает от смены состава ADK)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]
